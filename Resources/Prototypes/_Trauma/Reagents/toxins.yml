- type: reagent
  id: Johntonite
  name: reagent-name-johntonite
  group: Toxins
  desc: reagent-desc-johntonite
  physicalDesc: reagent-physical-desc-powdery
  flavor: bitter
  color: "#1abcff"
  metabolisms:
    Poison:
      metabolismRate: 0.5
      conditions:
      - !type:NameContainsCondition
        name: John
      effects:
      - !type:HealthChange
        damage:
          types:
            Asphyxiation: 1.5
            Heat: 5
            Cellular: 1
      - !type:PopupMessage
        type: Local
        visualType: MediumCaution
        probability: 0.03
        messages:
        - generic-reagent-effect-burning-insides
        - generic-reagent-effect-tearing-up
      - !type:ModifyParalysis
        probability: 0.2
        time: 2
      - !type:Emote
        emote: Gasp
        probability: 0.1
      - !type:Emote
        emote: Scream
        probability: 0.1
      - !type:Jitter

- type: reagent
  id: NitricAcid
  name: reagent-name-nitric-acid
  group: Toxins
  desc: reagent-desc-nitric-acid
  physicalDesc: reagent-physical-desc-abrasive
  flavor: acid
  color: "#FAFAFA"
  boilingPoint: 356
  meltingPoint: 231
  plantMetabolism:
  - !type:PlantAdjustToxins
    amount: 10
  - !type:PlantAdjustWeeds
    amount: -2
  - !type:PlantAdjustHealth
    amount: -5
  reactiveEffects:
    Acidic:
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        ignoreResistances: false
        damage:
          types:
            Caustic: 0.1
      - !type:Emote
        emote: Scream
        probability: 0.1
  metabolisms:
    Poison:
      metabolismRate: 3.00 # Okay damage, high metabolism rate. You need a lot of units to crit. Simulates acid burning through you fast.
      effects:
      - !type:HealthChange
        damage:
          types:
            Caustic: 4
      - !type:PopupMessage
        type: Local
        visualType: Large
        messages: [ "generic-reagent-effect-burning-insides" ]
        probability: 0.33
      - !type:Emote
        emote: Scream
        probability: 0.2

- type: reagent
  id: Spores
  name: reagent-name-spores
  group: Toxins
  desc: reagent-desc-spores
  physicalDesc: reagent-physical-desc-starry
  color: "#6fb7ab"
  worksOnTheDead: true
  metabolisms: # TODO: Make infest certain invertibrates, and turn into shitty romerol with a fungus that virology needs to cure but isn't actually hard to deal with.
    Poison:
      metabolismRate: 0.2
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 0.4
            Cellular: 0.2 # Give med more work
      - !type:Emote
        emote: Scream
        probability: 0.05
        conditions:
      - !type:ModifyStatusEffect
        effectProto: StatusEffectSeeingRainbow
        type: Add
        time: 1
      - !type:Drunk
        boozePower: 1

- type: reagent
  id: MycelialBlood
  name: reagent-name-mycelialblood
  group: Biological
  desc: reagent-desc-mycelialblood
  physicalDesc: reagent-physical-desc-fibrous
  flavor: bitter
  color: "#2b0700" # Intentional to look like Zombie Blood. Suffer.
  worksOnTheDead: true
  tileReactions:
  - !type:FlammableTileReaction
    temperatureMultiplier: 2 # Burns hot to let flamethrowers deal with them better
  - !type:CreateEntityTileReaction
    entity: SpiderWebMycelium
    maxOnTileWhitelist:
      tags: [ Carpet ] # Can't mycelium carpets because uh...
  metabolisms:
    Drink:
      effects:
      - !type:SatiateThirst
        factor: -0.5
    Poison:
      effects:
      - !type:HealthChange
        damage:
          types:
            Cellular: 0.5
            Blunt: -0.5
            Slash: -0.5
            Piercing: -0.5
        IgnoreResistances: false
      - !type:Vomit
        probability: 0.25
      - !type:Flammable
        multiplier: 0.4
      - !type:ModifyStatusEffect
        effectProto: StatusEffectSeeingRainbow
        type: Add
        time: 4
      - !type:Drunk
        boozePower: 1
  reactiveEffects:
    Flammable:
      methods: [ Touch ]
      effects:
      - !type:Flammable
        multiplier: 0.4