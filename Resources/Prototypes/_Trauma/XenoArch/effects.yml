- type: entity
  id: XenoArtifactGlitchFireWave
  parent: BaseXenoArtifactEffect
  description: "- ReagentId: Burnite" # intentional
  components:
  - type: XAEApplyComponents
    applyIfAlreadyHave: true
    refreshOnReactivate: true
    components:
    - type: XAECreatePuddle
      chemAmount:
        min: 1
        max: 1
      chemicalSolution:
        maxVol: 100
        canReact: false
      possibleChemicals:
      - Burnite

