# FoodBase without perishable stuff
- type: entity
  abstract: true
  parent: EdibleBase
  id: FoodUnperishableBase
  components:
  # FoodBase, no perishable stuff
  - type: SpaceGarbage
  # FoodInjectableBase
  - type: InjectableSolution
    solution: food
  - type: RefillableSolution
    solution: food

# FoodProduceBase without perishable stuff
- type: entity
  abstract: true
  parent: FoodUnperishableBase
  id: FoodProduceUnperishableBase
  components:
  # FoodProduceBase
  - type: SolutionContainerManager
  - type: Sprite
    state: produce
  - type: Produce
  - type: PotencyVisuals
  - type: Appearance
  - type: Extractable
    grindableSolutionName: food

- type: entity
  parent: FoodProduceBase
  id: FoodLemonade
  name: lemonade
  description: When life gives you lemons, commit arson. With the lemons.
  suffix: Food
  components:
  - type: FlavorProfile
    flavors:
    - sour
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 9
        reagents:
        - ReagentId: Napalm
          Quantity: 5
        - ReagentId: Vitamin
          Quantity: 4
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Hydroponics/lemonade.rsi
  - type: Item
    heldPrefix: produce
  - type: Produce
    seedId: Lemonade
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: JuiceLemonade # lol
        Quantity: 10
  - type: Tag
    tags:
    - Fruit
  - type: Edible
    trash:
    - LemonGrenade
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: LemonGrenade

- type: entity
  parent: FoodProduceBase
  id: FoodGlitchLemon
  name: ???
  description: You probably shouldn't be using this
  suffix: Food
  components:
  # Artifact stuff start
  - type: XenoArtifact
    effectsTable: !type:NestedSelector
      tableId: XenoArtifactEffectsLemonTable
  - type: RadiationReceiver
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
      Acidic: [Touch]
  - type: MovementSpeedModifier
    baseWalkSpeed: 0.3
    baseSprintSpeed: 0.5
  - type: UseDelay
  - type: Damageable
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
      enum.InstrumentUiKey.Key:
        type: InstrumentBoundUserInterface
      enum.IntercomUiKey.Key:
        type: IntercomBoundUserInterface
  # Artifact stuff end
  - type: SwapTeleportOnThrow
  - type: FlavorProfile
    flavors:
    - glitchlemon
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: JuiceGlitchLemon
          Quantity: 5
        - ReagentId: Singulo
          Quantity: 5
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Hydroponics/glitchlemon.rsi
  - type: Item
    heldPrefix: produce
  - type: Produce
    seedId: GlitchLemon
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: JuiceGlitchLemon
        Quantity: 10
  - type: Tag
    tags:
    - Fruit
  - type: RandomTimerTrigger
    min: 5
    max: 300
  - type: TriggerOnSpawn
  - type: SpawnOnTrigger
    keysIn:
    - timer
    proto: GlitchFire
  - type: TimerTrigger
    delay: 60
    examinable: false
  - type: DeleteOnTrigger
    keysIn:
    - timer