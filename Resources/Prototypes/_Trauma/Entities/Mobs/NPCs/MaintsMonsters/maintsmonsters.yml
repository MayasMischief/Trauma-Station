- type: entity
  abstract: true
  parent: SimpleMobBase
  id: BaseMaintsMonster
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 30
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed : 5
    baseSprintSpeed : 5
  - type: MobThresholds
    thresholds:
      0: Alive
      50: Critical
      100: Dead
  - type: Tag
    tags:
    - CannotSuicide
  - type: Hunger
    startingHunger: 40
    thresholds:
      Overfed: 150
      Okay: 75
      Peckish: 25
      Starving: 10
      Dead: 0
    hungerThresholdDecayModifiers:
      Okay: 1.5
      Peckish: 0.4
      Starving: 0.2
      Dead: 0.1
    baseDecayRate: 0.5
    starvingSlowdownModifier: 0
  - type: NpcFactionMember
    factions:
    - Xeno
  - type: HTN
    rootTask:
      task: MaintsMonsterCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavSmash: !type:Bool
        true
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
  - type: Prying
    pryPowered: true
  - type: ComplexInteraction

- type: entity
  abstract: true
  parent: BaseMaintsMonster
  id: BaseMaintsMonsterMycelial
  components:
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: MycelialBlood
        Quantity: 50
    bloodlossDamage:
      types:
        Bloodloss:
          0.5
    bloodlossHealDamage:
      types:
        Bloodloss:
          -0.25
  - type: TriggerOnMobstateChange
    mobState:
      - Dead
  - type: MobPrice
    price: 10 # This shit useless to others.
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Fungal
  - type: EmitSoundOnTrigger
    sound:
      collection: Explosion
  - type: SmokeOnTrigger
    duration: 5
    spreadAmount: 5
    solution:
      reagents:
        - ReagentId: Spores
          Quantity: 5
  - type: WeakToHoly # Not because they're weak to it, but so they can take holy damage.
    alwaysTakeHoly: true

- type: entity
  abstract: true
  parent: BaseMaintsMonsterMycelial
  id: BaseMaintsMonsterMycelialRanged
  components:
  - type: HTN
    rootTask:
      task: MaintsMonsterRangedCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavSmash: !type:Bool
        true
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true

- type: entity
  name: Sproach
  parent: BaseMaintsMonsterMycelial
  id: MobMaintsSproach
  description: A fungal infestation upon a giant cockroach husk. Reportedly tastes like meat, but it's probably not a good idea to try it.
  components:
  - type: Sprite
    drawdepth: SmallMobs
    sprite: Mobs/Animals/cockroach.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: cockroach
  - type: MovementSpeedModifier
    baseWalkSpeed : 5
    baseSprintSpeed : 5
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Critical
      50: Dead
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 2
        Slash: 2
        Blunt: 2
        Structural: 1

- type: entity
  name: Sportar Launcher
  parent: BaseMaintsMonsterMycelialRanged
  id: MobMaintsSportarLauncher
  description: The fungal infestation on this crab seems to have mutated it into a sort of organic mortar launcher.
  components:
  - type: Sprite
    drawdepth: SmallMobs
    sprite: Mobs/Animals/cockroach.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: cockroach
  - type: MovementSpeedModifier
    baseWalkSpeed : 5
    baseSprintSpeed : 5
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Critical
      50: Dead
  - type: Gun
    fireRate: 1
    useKey: false
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot: /Audio/Weapons/Guns/Gunshots/pistol.ogg
  - type: Battery
    maxCharge: 100
    startingCharge: 100
  - type: BatteryAmmoProvider
    proto: BulletGrenadeSpore
    fireCost: 30
  - type: BatterySelfRecharger
    autoRechargeRate: 2.5
  - type: MeleeWeapon
    damage:
      types:
        Poison: 2 # YES, DIRECT POISON DAMAGE.
        Structural: 1

